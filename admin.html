<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ABC Restaurant · Service desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #f7f8f5
        }

        .admin-wrap {
            max-width: 1050px;
            padding-top: 35px
        }

        .admin-hero {
            background: #eaf0e6;
            border-radius: 17px;
            padding: 27px 31px
        }

            .admin-hero h1 {
                font: 600 32px var(--serif);
                margin: 8px 0
            }

            .admin-hero p {
                color: #748074;
                font-size: 12px;
                margin: 0
            }

        .admin-section {
            background: #fff;
            border: 1px solid #eceee8;
            border-radius: 14px;
            padding: 21px;
            margin-top: 20px
        }

            .admin-section h2 {
                font: 600 22px var(--serif)
            }

        .table-tile {
            border: 1px solid #e8ebe4;
            border-radius: 10px;
            padding: 14px
        }

        .tile-title {
            font-size: 12px;
            font-weight: 700
        }

        .tile-meta {
            font-size: 10px;
            color: #8b9388;
            margin-top: 5px
        }

        .request-row {
            border-bottom: 1px solid #eff0eb;
            padding: 13px 2px;
            display: flex;
            align-items: center;
            gap: 15px
        }

            .request-row:last-child {
                border: 0
            }

        .request-badge {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #dc9654
        }

        .request-row.completed .request-badge {
            background: #8db17e
        }

        .request-detail {
            flex: 1
        }

            .request-detail strong {
                font-size: 12px
            }

            .request-detail small {
                display: block;
                color: #8d958b;
                font-size: 10px;
                margin-top: 3px
            }

        .empty-state {
            padding: 28px;
            text-align: center;
            color: #8c948b;
            font-size: 12px
        }

        .admin-tools {
            display: flex;
            gap: 8px;
            align-items: center
        }

            .admin-tools button {
                font-size: 10px
            }

        .table-link {
            font-size: 10px;
            color: #517454
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">
            <span class="brand-mark">A</span>
            <span>ABC <i>RESTAURANT</i></span>
        </a>
        <a class="admin-link" href="index.html">← Customer view</a>
    </header>
    <main class="container admin-wrap">
        <section class="admin-hero">
            <span class="eyebrow">DEMO SERVICE DESK</span>
            <h1>Good service starts here.</h1><p>Table overview and live requests from this browser.</p>
        </section>
        <section class="admin-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div><span class="eyebrow">FLOOR OVERVIEW</span><h2 class="mt-1">Your tables</h2></div>
                <div class="admin-tools">
                    <button class="btn btn-outline-secondary btn-sm" id="seed-request">Add demo request</button>
                    <button class="btn btn-outline-secondary btn-sm" id="clear-demo">Clear demo data</button>
                </div>
            </div>
            <div class="row g-2" id="tables-grid"></div>
        </section><section class="admin-section">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <span class="eyebrow">NEEDS ATTENTION</span><h2 class="mt-1 mb-0">Waiter requests</h2>
                </div>
                <span class="badge text-bg-light" id="open-count"></span>
            </div><div id="requests-list"></div>
        </section>
        <p class="text-muted text-center my-4" style="font-size:10px">This is a local demo dashboard. Data is saved in your browser only.</p>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
<script defer src="js/admin-updates.js"></script>
<script defer src="js/admin-floor.js"></script>
<script defer src="js/admin-cart-state.js"></script>
